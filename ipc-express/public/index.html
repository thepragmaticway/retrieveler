<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPC Express Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f3f7ff, #dfefff);
        color: #16324f;
      }

      main {
        width: min(640px, calc(100vw - 32px));
        padding: 32px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 60px rgba(22, 50, 79, 0.12);
      }

      h1 {
        margin-top: 0;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #e7f0fb;
      }

      pre {
        padding: 16px;
        overflow: auto;
        border-radius: 12px;
        background: #0f2238;
        color: #eaf4ff;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: #0f6cbd;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>IPC Express Demo</h1>
      <p>
        This page is served by <code>express.static(process.cwd())</code>.
      </p>
      <p>
        Try the sample API at <code>/api/hello</code>.
      </p>
      <button id="load-api" type="button">Load API Response</button>
      <pre id="output">Click the button to fetch /api/hello</pre>
    </main>
    <script>
      const button = document.getElementById("load-api");
      const output = document.getElementById("output");

      button.addEventListener("click", async () => {
        output.textContent = "Loading...";

        try {
          const response = await fetch("/api/hello");
          const data = await response.json();
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = error instanceof Error ? error.message : String(error);
        }
      });
    </script>
  </body>
</html>
