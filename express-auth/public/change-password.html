<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<link rel="stylesheet" href="/forms.css">
</head>
<body>
<div class="card">
  <h1>Change password</h1>
  <p class="page-note">This page teaches <code>PUT /api/password</code>.</p>

  <div class="form-row">
    <label class="field-label" for="current-password">Current password</label>
    <input class="field-input" id="current-password" type="password" placeholder="Enter current password">
  </div>

  <div class="form-row">
    <label class="field-label" for="new-password">New password</label>
    <input class="field-input" id="new-password" type="password" placeholder="Enter new password" minlength="8">
  </div>

  <button id="submit-btn" class="submit-btn" type="button">Send PUT request</button>
  <p id="message" class="status-message"></p>

  <p class="card-footer">
    <a href="/">Back to home</a>
  </p>
</div>
<script>
  const currentPasswordInput = document.getElementById("current-password");
  const newPasswordInput = document.getElementById("new-password");
  const submitButton = document.getElementById("submit-btn");
  const messageElement = document.getElementById("message");

  function showMessage(text, type) {
    messageElement.textContent = text;
    messageElement.className = "status-message " + type;
  }

  submitButton.addEventListener("click", async function() {
    const currentPassword = currentPasswordInput.value.trim();
    const newPassword = newPasswordInput.value.trim();

    try {
      const response = await fetch("/api/password", {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          currentPassword: currentPassword,
          newPassword: newPassword
        })
      });

      const data = await response.json();

      if (!response.ok) {
        showMessage(data.error || "Password update failed.", "error");
        return;
      }

      currentPasswordInput.value = "";
      newPasswordInput.value = "";
      showMessage(data.message || "Password updated successfully.", "success");
      window.location.href = "/";
    } catch (error) {
      showMessage("Request failed.", "error");
    }
  });
</script>
</body>
</html>
