<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="stylesheet" href="/forms.css">
</head>
<body>
<div class="card">
  <h1>Create account</h1>
  <p id="error-message" class="error-banner" hidden></p>

  <form method="POST" action="/signup">
    <div class="form-row">
      <label class="field-label" for="displayName">Display name</label>
      <input class="field-input" id="displayName" name="displayName" type="text" placeholder="Enter display name" required>
    </div>

    <div class="form-row">
      <label class="field-label" for="username">Username</label>
      <input class="field-input" id="username" name="username" type="email" placeholder="Enter email" required>
    </div>

    <div class="form-row">
      <label class="field-label" for="password">Password</label>
      <input class="field-input" id="password" name="password" type="password" placeholder="Create password" required>
    </div>

    <button class="submit-btn" type="submit">Sign up</button>
  </form>

  <p class="card-footer">
    Already have an account? <a href="/login">Log in</a>
  </p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const error = params.get("error");
  const errorElement = document.getElementById("error-message");

  if (error) {
    errorElement.textContent = error;
    errorElement.hidden = false;
  }
</script>
</body>
</html>
